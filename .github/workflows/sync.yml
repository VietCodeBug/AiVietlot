name: Mega 6-45 sync

on:
  workflow_dispatch:
  schedule:
    - cron: '45 11 * * 0,3,5'
    - cron: '15 12 * * 0,3,5'
    - cron: '15 13 * * 0,3,5'
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: mega645-ingestion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        id: install
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps .
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          import sys
          names = ('SUPABASE_URL', 'SUPABASE_SECRET_KEY')
          missing = [name for name in names if not os.environ.get(name, '').strip()]
          if missing:
              sys.exit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          PY
      - name: Sync new and missing draws
        run: mega-collector --backend supabase sync
      - name: Publish reproducible walk-forward analysis
        run: python collector/scripts/analyze.py
      - name: Audit database after ingestion
        if: always() && steps.install.outcome == 'success'
        run: mega-collector --backend supabase audit --check-source --output artifacts/audit.json
      - name: Keep audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mega645-sync-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/audit.json
          if-no-files-found: warn
          retention-days: 30
