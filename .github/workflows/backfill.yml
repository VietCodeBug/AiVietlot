name: Mega 6-45 backfill

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Optional positive page limit; leave empty for the complete archive'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: mega645-ingestion
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        id: install
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps .
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          import sys
          names = ('SUPABASE_URL', 'SUPABASE_SECRET_KEY')
          missing = [name for name in names if not os.environ.get(name, '').strip()]
          if missing:
              sys.exit('Missing GitHub Actions secrets: ' + ', '.join(missing))
          PY
      - name: Backfill with database-based resume
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          args = ['mega-collector', '--backend', 'supabase', 'backfill',
                  '--checkpoint', 'artifacts/backfill.json']
          value = os.environ.get('MAX_PAGES', '').strip()
          if value:
              if not re.fullmatch(r'[0-9]+', value) or int(value) < 1:
                  sys.exit('max_pages must be a positive integer, or empty')
              args += ['--max-pages', str(int(value))]
          sys.exit(subprocess.call(args))
          PY
      - name: Audit database after ingestion
        if: always() && steps.install.outcome == 'success'
        run: mega-collector --backend supabase audit --check-source --output artifacts/audit.json
      - name: Publish reproducible walk-forward analysis
        if: success()
        run: python collector/scripts/analyze.py
      - name: Keep audit and checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mega645-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/audit.json
            artifacts/backfill.json
          if-no-files-found: warn
          retention-days: 30
